# vesc.yaml — f1tenth_ws/src/f1tenth_system/f1tenth_stack/config/vesc.yaml
#
# 책 본문 4.7절 Step 4와 짝을 이루는 예시 설정입니다. 아래 값은 Roboracer
# 표준 차량의 기본값(4.4·4.5절에서 이미 만난 숫자)이며, 여러분의 차량에서는
# 그대로 맞지 않을 수 있습니다 — 반드시 본문 표(4.7절)의 절차대로 직접
# 튜닝해 이 파일의 값을 덮어쓰세요.
/**:
  ros__parameters:
    # 1. 조향 오프셋 — 직진 시 중립점. 일반 범위: 0.4~0.6
    steering_angle_to_servo_offset: 0.5304

    # 2. ERPM 게인 — 명령 속도 대 실제 이동 거리 비율. 일반 범위: 2000~5000
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0

    # 3. 조향각 게인 — 목표 회전 반경에 맞춤. 일반 범위: 1.1~1.3
    steering_angle_to_servo_gain: -1.2135
